version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, github_actions]
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      development-tools:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Playwright 1.63 requires Node >=20; core compatibility includes Node 18.
      # Review minor/major browser-tool upgrades alongside the Node support policy.
      - dependency-name: playwright
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2
