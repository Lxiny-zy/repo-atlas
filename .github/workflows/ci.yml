name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run verify:schema
  browser:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/build.mjs tests/fixtures/multi-chain/atlas.json
      - run: node scripts/verify.mjs tests/fixtures/multi-chain/report.html --browser ${{ matrix.browser }}
      - run: node scripts/prepare-review-fixture.mjs tmp-review-ci
      - run: node scripts/verify.mjs tmp-review-ci/unresolved/report.html --browser ${{ matrix.browser }}
      - run: node scripts/verify.mjs tmp-review-ci/accepted/.repo-atlas/accepted/fixture/report.html --browser ${{ matrix.browser }}
      - run: node scripts/build.mjs examples/order-journey/atlas.json
      - run: node scripts/verify-reader.mjs examples/order-journey/report.html --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification-${{ matrix.browser }}
          include-hidden-files: true
          retention-days: 14
          path: |
            tests/fixtures/multi-chain/report.verification/
            tmp-review-ci/unresolved/report.verification/
            tmp-review-ci/accepted/.repo-atlas/accepted/fixture/report.verification/
            examples/order-journey/reader.verification/
