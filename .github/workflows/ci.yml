name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run verify:schema
  browser:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/build.mjs tests/fixtures/multi-chain/atlas.json
      - run: node scripts/verify.mjs tests/fixtures/multi-chain/report.html --browser ${{ matrix.browser }}
      - run: node scripts/prepare-review-fixture.mjs tmp-review-ci
      - run: node scripts/verify.mjs tmp-review-ci/unresolved/report.html --browser ${{ matrix.browser }}
      - run: node scripts/verify.mjs tmp-review-ci/accepted/.repo-atlas/accepted/fixture/report.html --browser ${{ matrix.browser }}
      - run: node scripts/build.mjs examples/order-journey/atlas.json
      - run: node scripts/verify-reader.mjs examples/order-journey/report.html --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-verification-${{ matrix.browser }}
          include-hidden-files: true
          retention-days: 14
          path: |
            tests/fixtures/multi-chain/report.verification/
            tmp-review-ci/unresolved/report.verification/
            tmp-review-ci/accepted/.repo-atlas/accepted/fixture/report.verification/
            examples/order-journey/reader.verification/

  quality-gate:
    name: Quality gate
    if: always()
    needs: [test, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test and browser job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$BROWSER_RESULT" = success
